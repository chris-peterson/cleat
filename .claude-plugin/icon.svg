<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="cleat">
  <rect width="64" height="64" rx="14" fill="#282a36"/>
  <!-- A cleat hitch laid athwart, the way a dock cleat is mounted. The line is a
       tube (a green stroke with a plate-coloured core), so strands read as
       outlined rope and the crossing passes visibly over the cleat. The knot is
       authored upright and spun a quarter turn; the tails are authored in place. -->
  <g fill="none" stroke-linecap="round">
    <!-- standing part and working end, running off either side -->
    <path d="M37.5 21 C43 16 50 13 58 14" stroke="#50fa7b" stroke-width="5"/>
    <path d="M37.5 21 C43 16 50 13 58 14" stroke="#282a36" stroke-width="2.2"/>
    <path d="M26.5 43 C21 48 14 51 6 50"  stroke="#50fa7b" stroke-width="5"/>
    <path d="M26.5 43 C21 48 14 51 6 50"  stroke="#282a36" stroke-width="2.2"/>
  </g>
  <g transform="rotate(90 32 32)" fill="none" stroke-linecap="round">
    <!-- the figure-eight: a turn round each horn, crossing at centre -->
    <path d="M42 27 C42 17 37 12 32 12 C27 12 22 17 22 27
             C25 30 39 34 42 37
             C42 47 37 52 32 52 C27 52 22 47 22 37
             C25 34 39 30 42 27 Z" stroke="#50fa7b" stroke-width="5"/>
    <path d="M42 27 C42 17 37 12 32 12 C27 12 22 17 22 27
             C25 30 39 34 42 37
             C42 47 37 52 32 52 C27 52 22 47 22 37
             C25 34 39 30 42 27 Z" stroke="#282a36" stroke-width="2.2"/>
    <!-- the cleat, filled so the line passes behind it rather than through -->
    <rect x="28.4" y="5" width="7.2" height="54" rx="3.6" fill="#282a36" stroke="#8be9fd" stroke-width="2"/>
    <!-- the near half of the crossing, re-laid over the cleat -->
    <path d="M22 27 C25 30 39 34 42 37" stroke="#282a36" stroke-width="8"/>
    <path d="M22 27 C25 30 39 34 42 37" stroke="#50fa7b" stroke-width="5"/>
    <path d="M22 27 C25 30 39 34 42 37" stroke="#282a36" stroke-width="2.2"/>
  </g>
</svg>
